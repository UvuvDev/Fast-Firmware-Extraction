name: Sync main from core-main

on:
  push:
    branches: [core-main]

permissions:
  contents: write

jobs:
  fast-forward-main:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Fast-forward main to core-main
        run: |
          git merge --ff-only origin/core-main
          git push origin main
