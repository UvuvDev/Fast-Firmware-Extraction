[package]
name = "firmware-unpack"
version = "0.1.0"
edition = "2024"
license = "MIT"
publish = false
description = "Firmware container parsers independent of Binary Ninja"

[dependencies]
aho-corasick = "=1.1.4"
miniz_oxide = { version = "=0.8.9", default-features = false }
crc32fast = "1.5"

[dev-dependencies]
serde_json = "1.0"
sha2 = "0.10"

# Avoid Rust/LLVM's stripped Mach-O LINKEDIT alignment bug on macOS 27.
[profile.release]
strip = "none"

[lib]
path = "native/src/lib.rs"
crate-type = ["rlib", "cdylib"]

[[test]]
name = "fixtures"
path = "native/tests/fixtures.rs"

[[bin]]
name = "firmware-unpack"
path = "native/src/main.rs"
