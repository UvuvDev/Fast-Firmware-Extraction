[package]
name = "firmware-unpack"
version = "0.1.0"
edition = "2024"
license = "MIT"
publish = false
description = "Firmware container parsers independent of Binary Ninja"

[dependencies]
backhand = { version = "=0.25.5", default-features = false, features = ["xz", "xz-static", "error-strings"] }
crc32fast = "1.5"
lzma-rust2 = { version = "=0.21.0", default-features = false, features = ["std"] }

[dev-dependencies]
serde_json = "1.0"
sha2 = "0.10"

# Avoid Rust/LLVM's stripped Mach-O LINKEDIT alignment bug on macOS 27.
[profile.release]
strip = "none"

[lib]
path = "native/src/lib.rs"
crate-type = ["rlib", "cdylib"]

[[test]]
name = "dtbo"
path = "native/tests/dtbo.rs"

[[test]]
name = "r7000"
path = "native/tests/r7000.rs"

[[test]]
name = "fixtures"
path = "native/tests/fixtures.rs"

[[bin]]
name = "firmware-unpack"
path = "native/src/main.rs"
